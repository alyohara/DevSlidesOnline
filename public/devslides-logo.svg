<svg viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Slide Card Gradient -->
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Accent / Highlight Gradient -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Base Icon Shape / Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Back Slide (Stack effect) -->
  <rect x="120" y="96" width="312" height="196" rx="16" fill="#1E293B" opacity="0.6" />

  <!-- Middle Slide (Stack effect) -->
  <rect x="100" y="124" width="312" height="196" rx="16" fill="#334155" opacity="0.8" />

  <!-- Main Front Slide -->
  <rect x="80" y="152" width="352" height="224" rx="20" fill="url(#card)" stroke="#6366F1" stroke-width="4" />

  <!-- Window Header Dots -->
  <circle cx="116" cy="184" r="7" fill="#EF4444" />
  <circle cx="136" cy="184" r="7" fill="#F59E0B" />
  <circle cx="156" cy="184" r="7" fill="#10B981" />

  <!-- Code Lines / Content -->
  <!-- Line 1: Code Tag opening -->
  <path d="M 120 236 L 140 216 M 120 236 L 140 256" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 170 216 L 150 256" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 180 216 L 200 236 M 180 256 L 200 236" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Highlighted Code Step (The core feature of DevSlides) -->
  <rect x="224" y="218" width="168" height="36" rx="8" fill="url(#highlight)" opacity="0.3" />
  <rect x="232" y="230" width="100" height="12" rx="6" fill="#38BDF8" />

  <!-- Code Line 2 (Dimmed) -->
  <rect x="120" y="280" width="140" height="10" rx="5" fill="#64748B" />
  <rect x="270" y="280" width="80" height="10" rx="5" fill="#475569" />

  <!-- Code Line 3 (Dimmed) -->
  <rect x="140" y="306" width="180" height="10" rx="5" fill="#475569" />

  <!-- Presentation Play Badge (Bottom Right Accent) -->
  <circle cx="384" cy="336" r="28" fill="#F43F5E" />
  <polygon points="378,324 396,336 378,348" fill="#FFFFFF" />
</svg>
